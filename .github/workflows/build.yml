name: Build
on:
  push:
    branches: [ci-build]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.bat
      - uses: actions/upload-artifact@v4
        with:
          name: OpenChatMix-win-x64
          path: build/OpenChatMix.exe
